# The static baseline policy. The sandbox image carries it at /etc/openshell/policy.yaml, and the
# generator starts every build's policy from it and fills in network_policies. It is plain YAML,
# copied as it is, with no templating.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /opt
    - /proc
    - /dev/urandom
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/shm

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
