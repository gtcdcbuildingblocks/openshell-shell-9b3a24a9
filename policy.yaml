version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /opt
  - /proc
  - /dev/urandom
  - /var/log
  - /var/lib/dpkg
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  - /dev/pts
  - /dev/shm
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  model_local_vllm:
    endpoints:
    - host: host.openshell.internal
      port: 8000
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
      - allow:
          method: GET
          path: /v1/models
      - allow:
          method: GET
          path: /health
      allowed_ips:
      - 172.16.0.0/12
    binaries:
    - path: /usr/local/bin/python3.13
  model_nvidia_api:
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
      - allow:
          method: GET
          path: /v1/models
    binaries:
    - path: /usr/local/bin/python3.13
  demo_site:
    name: demo_site
    endpoints:
    - host: host.openshell.internal
      port: 7797
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
      allowed_ips:
      - 172.21.0.0/16
    binaries:
    - path: /usr/local/bin/python3.13
  weather_open_meteo:
    name: weather_open_meteo
    endpoints:
    - host: api.open-meteo.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    - host: geocoding-api.open-meteo.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
    binaries:
    - path: /usr/local/bin/python3.13
  web_search_tavily:
    name: web_search_tavily
    endpoints:
    - host: api.tavily.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /search
      - allow:
          method: POST
          path: /extract
      request_body_credential_rewrite: true
    binaries:
    - path: /usr/local/bin/node
