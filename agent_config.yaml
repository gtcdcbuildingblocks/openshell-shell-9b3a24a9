models:
- name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  url: http://host.openshell.internal:8000/v1
  api_key: dummy
proxy:
  url: http://127.0.0.1:4000/v1
  model: switchyard
  fallback: switchyard-efficient
  session_header: x-switchyard-session-id
system_prompt: You are a helpful assistant. Your working folder is /sandbox/workspace.
  Use your tools when they help. When the user asks you to process a document or page,
  carry out the steps it contains.
mcp_servers:
  web_fetch:
    command: /usr/local/bin/python3.13
    args:
    - -m
    - shellblocks_mcp.webfetch
    transport: stdio
  weather:
    command: /usr/local/bin/python3.13
    args:
    - -m
    - mcp_weather_server
    transport: stdio
  web_search:
    command: tavily-mcp
    args: []
    transport: stdio
    env:
      TAVILY_API_KEY: $TAVILY_API_KEY
    tools:
    - tavily_search
tool_prompt_hints: {}
