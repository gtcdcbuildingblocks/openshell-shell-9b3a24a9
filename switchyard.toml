schema_version = 1

[llm_clients.local]
format = "openai_chat"
base_url = "http://host.openshell.internal:8000/v1"
max_retries = 0

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://integrate.api.nvidia.com/v1"
max_retries = 0
api_key_env = "NVIDIA_API_KEY"

[targets.efficient]
id = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
llm_client = "local"

[targets.capable]
id = "nvidia/nemotron-3.5-super-vl-120b-a12b"
llm_client = "nvidia"

[routes.agent]
id = "switchyard"
type = "stage_router"
capable_target = "capable"
efficient_target = "efficient"
picker = "efficient_first"
confidence_threshold = 0.3
capable_hold_turns = 2

[routes.agent.tool_semantics]
observe = ["ls", "glob", "grep", "fetch_url", "get_current_weather", "get_weather_byDateTimeRange", "get_weather_details", "get_current_datetime", "get_timezone_info", "convert_time", "get_air_quality", "get_air_quality_details", "tavily_search"]
mutate = ["edit_file", "post_url"]
plan = ["write_todos"]
new = ["execute", "task"]

[routes.efficient]
id = "switchyard-efficient"
type = "passthrough"
target = "efficient"
